<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <input type="text" id="product_name" placeholder="product_name">
    <input type="text" id="description" placeholder="description">

    <input type="text" id="color1" class="color" placeholder="color1">
    <button onclick="create_color('color1')" id="color1_btn">create color</button>
    <input type="text" id="color2" class="color" placeholder="color2">

    <input type="file" name="images" id="file1" multiple>
    <button onclick="submit_colors()">submit</button>

    <div class="qauntity_form" id="qauntity_form"

    </div>

</head>

<body>
    <script>
        
        const formdata = new FormData()

        async function submit_colors() {
            
            formdata.append('pid', "aryan1720606131476")
            formdata.append('color_name', "deep green")
            formdata.append('color_code', "#0000")
            

           
              const sizes = [
                    { "size": "S", "price": 400, "stock": 100 },
                    { "size": "M", "price": 400, "stock": 100 },
                    { "size": "L", "price": 400, "stock": 100 },
                    { "size": "XL", "price": 400, "stock": 100 }
                ]
           
            
            formdata.append('sizes', JSON.stringify(sizes))
            Array.from(document.getElementById('file1').files).forEach(file => {
                formdata.append('deep green', file);
            });

            try {
                const options = {
                    method: 'POST',
                    headers: {
                        'authorization': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImFyeWFuIn0.2pc99p7IzrDQFdXRrR6rm_A4XABVMyewqLbgLrwL_0c'
                    },
                    body: formdata
                }
                const response = await fetch("http://localhost:8080/api/v1/seller/add_color", options)
                console.log(response)
            }
            catch (err) {
                console.error(err)
            }
        }

    </script>
</body>
